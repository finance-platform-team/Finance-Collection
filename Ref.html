<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andalusia Finance Platform — Loader</title>
  <style>
    :root {
      --gold: #a5845b;
      --green: #2e372d;
      --canvas: #f4f1ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1c231b;
    }

    .apl-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background .35s ease;
    }

    html[data-theme="dark"] .apl-loader {
      background: var(--green);
    }

    html[data-theme="light"] .apl-loader {
      background: var(--canvas);
    }

    .apl-grid {
      position: absolute;
      inset: 0;
      opacity: .04;
      background-image: linear-gradient(var(--gold) .5px, transparent .5px),
        linear-gradient(90deg, var(--gold) .5px, transparent .5px);
      background-size: 26px 26px;
    }

    .apl-mark {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 1.75rem;
    }

    .apl-mark svg {
      position: absolute;
      inset: 0;
    }

    .apl-ring-bg {
      transition: stroke .35s ease;
    }

    html[data-theme="dark"] .apl-ring-bg {
      stroke: rgba(244, 241, 234, .08);
    }

    html[data-theme="light"] .apl-ring-bg {
      stroke: rgba(46, 55, 45, .10);
    }

    .apl-ring {
      stroke: var(--gold);
      transform-origin: center;
      animation: apl-spin 1.5s cubic-bezier(.6, .1, .3, .9) infinite;
    }

    .apl-logo-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: apl-pulse 2s ease-in-out infinite;
    }

    .apl-logo {
      width: 74px;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .apl-word {
      position: relative;
      text-align: center;
    }

    .apl-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .5px;
      margin-bottom: 5px;
      transition: color .35s ease;
    }

    .apl-sub {
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: color .35s ease;
    }

    html[data-theme="dark"] .apl-title {
      color: var(--canvas);
    }

    html[data-theme="dark"] .apl-sub {
      color: rgba(244, 241, 234, .5);
    }

    html[data-theme="light"] .apl-title {
      color: var(--green);
    }

    html[data-theme="light"] .apl-sub {
      color: rgba(46, 55, 45, .55);
    }

    .apl-bar {
      position: relative;
      width: 210px;
      height: 3px;
      border-radius: 3px;
      margin-top: 2rem;
      overflow: hidden;
      transition: background .35s ease;
    }

    html[data-theme="dark"] .apl-bar {
      background: rgba(244, 241, 234, .1);
    }

    html[data-theme="light"] .apl-bar {
      background: rgba(46, 55, 45, .1);
    }

    .apl-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: var(--gold);
      border-radius: 3px;
      animation: apl-track 1.6s ease-in-out infinite;
    }

    .apl-status {
      position: relative;
      margin-top: 1rem;
      font-family: 'Consolas', 'SF Mono', monospace;
      font-size: 11px;
      letter-spacing: .5px;
      transition: color .35s ease;
    }

    html[data-theme="dark"] .apl-status {
      color: rgba(244, 241, 234, .4);
    }

    html[data-theme="light"] .apl-status {
      color: rgba(46, 55, 45, .5);
    }

    .apl-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 8px;
      background: rgba(165, 132, 91, .12);
      color: var(--gold);
      border: 1px solid rgba(165, 132, 91, .4);
    }

    .apl-toggle:hover {
      background: rgba(165, 132, 91, .2);
    }

    @keyframes apl-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes apl-pulse {

      0%,
      100% {
        opacity: .85;
        transform: scale(.95);
      }

      50% {
        opacity: 1;
        transform: scale(1.03);
      }
    }

    @keyframes apl-track {
      0% {
        left: -40%;
      }

      100% {
        left: 100%;
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .apl-ring,
      .apl-logo-wrap,
      .apl-bar-fill {
        animation: none;
      }

      .apl-bar-fill {
        width: 100%;
      }
    }
  </style>
</head>
